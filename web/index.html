<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EthioMorph, Ge'ez morphology</title>
    <link rel="icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    paper: "var(--paper)", ink: "var(--ink)", inksoft: "var(--inksoft)",
                    muted: "var(--muted)", faint: "var(--faint)", line: "var(--line)",
                    accent: "var(--accent)",
                },
                fontFamily: {
                    serif: ["Georgia", "Times New Roman", "serif"],
                    sans: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
                },
            }}
        };
    </script>
    <style>
        :root {
            color-scheme: light;
            --paper: #f4f1ea;
            --ink: #1c1916;
            --inksoft: #3e3932;
            --muted: #6e675c;
            --faint: #a89f91;
            --line: #d9d1c3;
            --accent: #7c3f36;
        }
        .dark {
            color-scheme: dark;
            --paper: #141210;
            --ink: #f3efe6;
            --inksoft: #d2cbc0;
            --muted: #a3988c;
            --faint: #6f675c;
            --line: #3a342c;
            --accent: #c9a097;
        }
        html { -webkit-font-smoothing: antialiased; background: var(--paper); }
        body { background: var(--paper); color: var(--ink); }
        ::selection { background: #e4dccb; color: var(--ink); }
        .dark ::selection { background: #3a342c; color: var(--ink); }
        :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
        .col {
            width: 100%;
            max-width: 42rem;
            margin-inline: auto;
            padding-inline: 1.5rem;
        }
        .geez { font-family: "Noto Sans Ethiopic", Nyala, sans-serif; line-height: 1.45; }
        .lbl {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }
        .mast-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.015em;
            line-height: 1;
            color: var(--ink);
        }
        .mast-sub {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--muted);
            margin-top: 0.45rem;
        }
        .page-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.65rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--ink);
            margin: 0 0 0.45rem;
        }
        .lede {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.02rem;
            line-height: 1.55;
            color: var(--muted);
            max-width: 36rem;
            margin: 0 0 2.25rem;
        }
        .section-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            font-weight: 400;
            line-height: 1.3;
            color: var(--ink);
            margin: 0 0 0.85rem;
        }
        .prose-essay .section-title { margin-top: 2.5rem; }
        .headword-block {
            padding-top: 0.35rem;
            padding-bottom: 1.85rem;
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--line);
        }
        .headword {
            font-family: "Noto Sans Ethiopic", Nyala, sans-serif;
            font-size: 2.75rem;
            font-weight: 400;
            line-height: 1.35;
            color: var(--ink);
            margin: 0;
        }
        .headword + .gloss,
        .headword + .subhead { margin-top: 0.7rem; }
        .gloss {
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--muted);
            max-width: 34rem;
            margin: 0;
        }
        .subhead {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--muted);
            margin: 0;
        }
        .hairline-t { border-top: 1px solid var(--line); }
        .hairline-b { border-bottom: 1px solid var(--line); }
        .entry-row {
            display: grid;
            grid-template-columns: 9.5rem 1fr;
            gap: 1.25rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--line);
        }
        @media (max-width: 640px) { .entry-row { grid-template-columns: 6.5rem 1fr; gap: 0.75rem; } }
        .word-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            font-family: "Noto Sans Ethiopic", Nyala, sans-serif;
            color: var(--ink);
            outline: none;
            border-radius: 0;
            width: 100%;
        }
        .word-input:focus { border-bottom-color: var(--accent); }
        .word-input:focus-visible { outline: none; }
        .word-input::placeholder { color: var(--faint); }
        .btn-quiet {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            letter-spacing: 0.01em;
            color: var(--ink);
            border: none;
            border-bottom: 1px solid var(--accent);
            border-radius: 0;
            padding: 0.1rem 0;
            background: transparent;
            cursor: pointer;
        }
        .btn-quiet:hover { color: var(--accent); }
        .btn-quiet:disabled { opacity: 0.4; cursor: default; border-bottom-color: var(--line); color: var(--muted); }
        .btn-quiet:disabled:hover { color: var(--muted); }
        .mode-toggle {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        .mode-toggle:hover { color: var(--ink); }
        .section-nav {
            display: flex;
            gap: 1.35rem;
            overflow-x: auto;
            margin-top: 1.75rem;
            border-bottom: 1px solid var(--line);
        }
        .navlink {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            color: var(--muted);
            padding: 0 0 0.55rem;
            margin-bottom: -1px;
            border: none;
            border-bottom: 1px solid transparent;
            background: none;
            cursor: pointer;
            border-radius: 0;
        }
        .navlink:hover { color: var(--ink); }
        .navlink.active { color: var(--ink); border-bottom-color: var(--accent); }
        table.paradigm { width: 100%; border-collapse: collapse; border: none; }
        table.paradigm th,
        table.paradigm td {
            padding: 0.5rem 1rem 0.5rem 0;
            border: none;
            border-bottom: 1px solid var(--line);
            vertical-align: baseline;
            text-align: left;
            font-weight: 400;
        }
        table.paradigm th {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }
        .prose-essay { max-width: 38rem; }
        .prose-essay p { margin-bottom: 1em; line-height: 1.65; color: var(--inksoft); }
        .prose-essay p strong { color: var(--ink); font-weight: 600; }
        a.quiet-link {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.18em;
        }
        a.quiet-link:hover { color: var(--ink); }
    </style>
</head>
<body class="font-sans min-h-screen">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API = {
            analyze: (word) => fetch("/api/analyze?word=" + encodeURIComponent(word)).then((r) => r.json()),
            expand: (root) => fetch("/api/expand?root=" + encodeURIComponent(root)).then((r) => r.json()),
            expandSimple: (root) => fetch("/api/expand/simple?root=" + encodeURIComponent(root)).then((r) => r.json()),
            templates: () => fetch("/api/templates").then((r) => r.json()),
        };

        const SUBJECTS = ["he", "she", "you_m", "you_f", "I", "we", "they_m", "they_f", "you_pl_m", "you_pl_f"];
        const IMPERATIVE_SUBJECTS = ["you_m", "you_f", "you_pl_m", "you_pl_f"];
        const SUBJECT_LABEL = {
            he: "3 m. sg.",
            she: "3 f. sg.",
            you_m: "2 m. sg.",
            you_f: "2 f. sg.",
            I: "1 sg.",
            we: "1 pl.",
            they_m: "3 m. pl.",
            they_f: "3 f. pl.",
            you_pl_m: "2 m. pl.",
            you_pl_f: "2 f. pl.",
        };
        const TENSES = [
            ["perfective", "Perfective"],
            ["imperfective", "Imperfective"],
            ["jussive", "Jussive"],
            ["imperative", "Imperative"],
        ];

        const TYPE_LABELS = {
            type_a: "Type A",
            type_b: "Type B",
            type_c: "Type C",
            type_c_o: "Type C, o",
            type_c_e: "Type C, e",
            "type_mahräka": "Mahräka",
            type_tanbala: "Tanbala",
            quad_a: "Quadriliteral A",
            quadriliteral: "Quadriliteral",
            hollow_w: "Hollow, w",
            hollow_y: "Hollow, y",
            weak_initial: "Weak initial",
            strong: "Strong",
            type_d: "Type D",
            type_a_passive: "Type A, passive",
            type_a_causative: "Type A, causative",
            type_a_aste: "Type A, አስተ",
            type_a_reciprocal: "Type A, reciprocal",
            particle_phrase: "Particle phrase",
            non_lexical: "Not a word",
            noun: "Noun",
            derived_noun: "Derived noun",
            merahiyan: "Pronoun",
            unknown: "Unknown",
        };
        const METHOD_LABELS = {
            order_math: "Vowel-order analysis",
            pattern_code: "Pattern code",
            lexicon: "Dictionary lookup",
            lexicon_noun: "Noun lexicon",
            particle_phrase: "Particle phrase",
            derived: "Morphological derivation",
            non_lexical: "Not a word",
            closed_class: "Closed class",
            grammar_form: "Grammar form",
        };

        const typeLabel = (t) => {
            if (typeof t !== "string" || !t) return "";
            if (TYPE_LABELS[t]) return TYPE_LABELS[t];
            return t.replace(/^type_/, "Type ").replace(/_/g, " ");
        };
        const methodLabel = (m) => {
            if (typeof m !== "string" || !m) return "";
            return METHOD_LABELS[m] || m.replace(/_/g, " ");
        };
        const subjectsFor = (tense) => (tense === "imperative" ? IMPERATIVE_SUBJECTS : SUBJECTS);
        const isPlain = (v) => typeof v === "string" || typeof v === "number";
        const plain = (v) => (isPlain(v) ? String(v) : "");

        const errorText = (data) => {
            if (!data || data.error == null || data.error === false) return "";
            return typeof data.error === "string" ? data.error : "The service returned an error.";
        };

        const stringList = (value) => {
            if (typeof value === "string" && value) return [value];
            if (!Array.isArray(value)) return [];
            return value.filter((item) => typeof item === "string" && item);
        };

        const patternName = (pattern) => {
            if (typeof pattern === "string") {
                if (pattern === "Unknown/Noun" || pattern === "unknown") return "Nominal";
                return pattern;
            }
            if (pattern && typeof pattern === "object") {
                if (typeof pattern.english_name === "string" && pattern.english_name) return pattern.english_name;
                if (typeof pattern.geez_name === "string" && pattern.geez_name) return pattern.geez_name;
                if (typeof pattern.name === "string") return pattern.name;
            }
            return "";
        };

        const ordersText = (pattern) => {
            if (!pattern || typeof pattern !== "object" || Array.isArray(pattern)) return "";
            return Object.keys(pattern)
                .filter((key) => isPlain(pattern[key]))
                .map((key) => key + " " + pattern[key])
                .join(", ");
        };

        const wordOf = (value) => {
            if (typeof value === "string") return value;
            if (value && typeof value === "object" && typeof value.word === "string") return value.word;
            return "";
        };

        const Page = ({ title, lede, children }) => (
            <article className="col pt-10 pb-16">
                <h1 className="page-title">{title}</h1>
                {lede ? <p className="lede">{lede}</p> : null}
                {children}
            </article>
        );

        const Fault = ({ children }) => (
            <p className="font-serif italic text-inksoft hairline-t pt-4">{children}</p>
        );

        const RootField = ({ id, label, value, onChange, onSubmit, busy, action }) => (
            <form
                className="flex items-end gap-4 mb-10"
                onSubmit={(event) => { event.preventDefault(); if (!busy && value.trim()) onSubmit(); }}
            >
                <div className="flex-1 max-w-xs">
                    <label className="lbl block mb-2" htmlFor={id}>{label}</label>
                    <input
                        id={id}
                        className="word-input text-3xl py-1"
                        value={value}
                        onChange={(event) => onChange(event.target.value)}
                        spellCheck="false"
                        autoCapitalize="off"
                    />
                </div>
                <button className="btn-quiet shrink-0" type="submit" disabled={busy || !value.trim()}>
                    {busy ? "Working" : action}
                </button>
            </form>
        );

        const Paradigm = ({ title, tense, forms, variants }) => {
            const bucket = variants && typeof variants === "object" ? variants[tense] : null;
            const rows = subjectsFor(tense)
                .filter((key) => forms && typeof forms[key] === "string" && forms[key])
                .map((key) => ({
                    key,
                    word: forms[key],
                    alts: stringList(bucket && bucket[key]).filter((alt) => alt !== forms[key]),
                }));
            if (!rows.length) return null;
            return (
                <section className="mb-10">
                    <h2 className="lbl mb-2">{title}</h2>
                    <table className="paradigm">
                        <tbody>
                            {rows.map((row) => (
                                <tr key={row.key}>
                                    <td className="text-muted text-sm w-28">{SUBJECT_LABEL[row.key]}</td>
                                    <td className="geez text-xl">
                                        {row.word}
                                        {row.alts.length ? (
                                            <span className="text-muted text-base ml-3">{row.alts.join(", ")}</span>
                                        ) : null}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </section>
            );
        };

        const DerivedList = ({ derived }) => {
            if (!derived || typeof derived !== "object" || Array.isArray(derived)) return null;
            const rows = Object.keys(derived).map((key) => {
                const value = derived[key];
                const word = wordOf(value);
                if (!word) return null;
                let note = "";
                if (value && typeof value === "object") {
                    if (typeof value.meaning === "string") note = value.meaning;
                    else if (typeof value.template === "string") note = value.template;
                }
                return { key, word, note };
            }).filter(Boolean);
            if (!rows.length) return null;
            return (
                <section className="mb-10">
                    <h2 className="lbl mb-2">Derived</h2>
                    <table className="paradigm">
                        <tbody>
                            {rows.map((row) => (
                                <tr key={row.key}>
                                    <td className="text-muted text-sm w-40">{typeLabel(row.key) || row.key.replace(/_/g, " ")}</td>
                                    <td>
                                        <span className="geez text-xl">{row.word}</span>
                                        {row.note ? <span className="font-serif italic text-muted text-sm ml-3">{row.note}</span> : null}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </section>
            );
        };

        const NominalList = ({ nominals }) => {
            if (!Array.isArray(nominals)) return null;
            const rows = nominals.map((entry, index) => {
                if (typeof entry === "string" && entry) return { index, word: entry, meaning: "" };
                if (entry && typeof entry === "object" && typeof entry.word === "string") {
                    return {
                        index,
                        word: entry.word,
                        meaning: typeof entry.meaning === "string" ? entry.meaning : "",
                    };
                }
                return null;
            }).filter(Boolean);
            if (!rows.length) return null;
            return (
                <section className="mb-10">
                    <h2 className="lbl mb-2">Lexicon nominals</h2>
                    <table className="paradigm">
                        <tbody>
                            {rows.map((row) => (
                                <tr key={row.index}>
                                    <td className="geez text-xl">{row.word}</td>
                                    <td className="gloss">{row.meaning}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </section>
            );
        };

        const AnalyzerTab = () => {
            const [word, setWord] = useState("አዝጋብርት");
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [fault, setFault] = useState("");

            const analyze = async () => {
                if (!word.trim()) return;
                setLoading(true);
                setFault("");
                try {
                    setResult(await API.analyze(word));
                } catch (e) {
                    setResult(null);
                    setFault("The request failed.");
                }
                setLoading(false);
            };

            useEffect(() => { analyze(); }, []);

            const analysis = result && result.analysis && typeof result.analysis === "object" ? result.analysis : {};
            const particles = Array.isArray(analysis.particles) ? analysis.particles : [];
            const steps = Array.isArray(result && result.derivation_path) ? result.derivation_path : [];
            const consonants = Array.isArray(result && result.root_consonants)
                ? result.root_consonants.filter((item) => typeof item === "string")
                : [];
            const shownError = errorText(result);

            return (
                <Page title="Analyzer" lede="A surface form, read back to its root.">
                    <RootField
                        id="analyze-word"
                        label="Word"
                        value={word}
                        onChange={setWord}
                        onSubmit={analyze}
                        busy={loading}
                        action="Analyze"
                    />
                    {fault ? <Fault>{fault}</Fault> : null}
                    {shownError ? <Fault>{shownError}</Fault> : null}
                    {result && !shownError ? (
                        <div>
                            <header className="headword-block">
                                <p className="headword">{plain(result.input) || word}</p>
                                {typeof result.meaning === "string" && result.meaning ? (
                                    <p className="gloss">{result.meaning}</p>
                                ) : null}
                            </header>
                            <div>
                                <div className="entry-row">
                                    <span className="lbl pt-1">Root</span>
                                    <span className="geez text-2xl">{result.root == null ? "none" : plain(result.root)}</span>
                                </div>
                                {typeof result.root_type === "string" && result.root_type ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Root type</span>
                                        <span className="text-inksoft">{typeLabel(result.root_type)}</span>
                                    </div>
                                ) : null}
                                {typeof analysis.method === "string" && analysis.method ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Method</span>
                                        <span className="text-inksoft">{methodLabel(analysis.method)}</span>
                                    </div>
                                ) : null}
                                {patternName(analysis.pattern) ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Pattern</span>
                                        <span className="text-inksoft">{patternName(analysis.pattern)}</span>
                                    </div>
                                ) : null}
                                {typeof result.word_class === "string" && result.word_class ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Class</span>
                                        <span className="text-inksoft">
                                            {result.word_class.replace(/_/g, " ")}
                                            {typeof result.word_class_geez === "string" && result.word_class_geez ? (
                                                <span className="geez text-ink ml-3">{result.word_class_geez}</span>
                                            ) : null}
                                        </span>
                                    </div>
                                ) : null}
                                {consonants.length ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Consonants</span>
                                        <span className="geez text-lg">{consonants.join(" · ")}</span>
                                    </div>
                                ) : null}
                                {typeof result.confidence === "number" ? (
                                    <div className="entry-row">
                                        <span className="lbl pt-1">Confidence</span>
                                        <span className="text-inksoft">{result.confidence.toFixed(2)}</span>
                                    </div>
                                ) : null}
                            </div>
                            {particles.length ? (
                                <section className="mt-10">
                                    <h2 className="lbl mb-2">Particles</h2>
                                    <div className="hairline-t">
                                        {particles.map((particle, index) => {
                                            if (!particle || typeof particle !== "object") return null;
                                            const form = typeof particle.form === "string" ? particle.form : "";
                                            const kind = typeof particle.english_type === "string"
                                                ? particle.english_type
                                                : (typeof particle.type === "string" ? particle.type.replace(/_/g, " ") : "");
                                            const gloss = typeof particle.meaning === "string" ? particle.meaning : "";
                                            if (!form && !kind && !gloss) return null;
                                            return (
                                                <div className="entry-row" key={form + index}>
                                                    <span className="geez text-xl">{form}</span>
                                                    <span className="text-inksoft">
                                                        {kind}
                                                        {gloss ? <span className="font-serif italic text-muted">, {gloss}</span> : null}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            ) : null}
                            {steps.length ? (
                                <section className="mt-10">
                                    <h2 className="lbl mb-2">Derivation</h2>
                                    <div className="hairline-t">
                                        {steps.map((step, index) => {
                                            if (!step || typeof step !== "object") return null;
                                            const action = typeof step.action === "string" ? step.action.replace(/_/g, " ") : "";
                                            const description = typeof step.description === "string" ? step.description : "";
                                            const before = typeof step.before === "string" ? step.before : "";
                                            const after = typeof step.after === "string" ? step.after : "";
                                            if (!action && !description && !before && !after) return null;
                                            return (
                                                <div className="entry-row" key={index}>
                                                    <span className="lbl pt-1">{typeof step.step === "number" ? step.step : index + 1}. {action}</span>
                                                    <span className="text-inksoft">
                                                        {description}
                                                        {(before || after) ? (
                                                            <span className="block mt-1">
                                                                {before ? <span className="geez">{before}</span> : null}
                                                                {before && after ? <span className="text-faint mx-2">to</span> : null}
                                                                {after ? <span className="geez">{after}</span> : null}
                                                            </span>
                                                        ) : null}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            ) : null}
                        </div>
                    ) : null}
                </Page>
            );
        };

        const ConjugatorTab = () => {
            const [root, setRoot] = useState("ቀተለ");
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [fault, setFault] = useState("");

            const run = async () => {
                if (!root.trim()) return;
                setLoading(true);
                setFault("");
                try {
                    setData(await API.expandSimple(root));
                } catch (e) {
                    setData(null);
                    setFault("The request failed.");
                }
                setLoading(false);
            };

            useEffect(() => { run(); }, []);
            const shownError = errorText(data);

            return (
                <Page title="Conjugator" lede="Perfective, imperfective, jussive, and imperative.">
                    <RootField id="conj-root" label="Root" value={root} onChange={setRoot} onSubmit={run} busy={loading} action="Conjugate" />
                    {fault ? <Fault>{fault}</Fault> : null}
                    {shownError ? <Fault>{shownError}</Fault> : null}
                    {data && !shownError ? (
                        <div>
                            <div className="headword-block">
                                <p className="headword">{root}</p>
                            </div>
                            {TENSES.map(([key, label]) => (
                                <Paradigm key={key} title={label} tense={key} forms={data[key]} variants={data.variants} />
                            ))}
                        </div>
                    ) : null}
                </Page>
            );
        };

        const WordFormsTab = () => {
            const [root, setRoot] = useState("ቀተለ");
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [fault, setFault] = useState("");

            const run = async () => {
                if (!root.trim()) return;
                setLoading(true);
                setFault("");
                try {
                    setData(await API.expandSimple(root));
                } catch (e) {
                    setData(null);
                    setFault("The request failed.");
                }
                setLoading(false);
            };

            useEffect(() => { run(); }, []);
            const shownError = errorText(data);

            return (
                <Page title="Word forms" lede="The paradigm, alternate spellings, derived classes, and lexicon nominals.">
                    <RootField id="forms-root" label="Root" value={root} onChange={setRoot} onSubmit={run} busy={loading} action="Show forms" />
                    {fault ? <Fault>{fault}</Fault> : null}
                    {shownError ? <Fault>{shownError}</Fault> : null}
                    {data && !shownError ? (
                        <div>
                            <div className="headword-block">
                                <p className="headword">{root}</p>
                            </div>
                            {TENSES.map(([key, label]) => (
                                <Paradigm key={key} title={label} tense={key} forms={data[key]} variants={data.variants} />
                            ))}
                            <DerivedList derived={data.derived} />
                            <NominalList nominals={data.nominals} />
                        </div>
                    ) : null}
                </Page>
            );
        };

        const CompareTab = () => {
            const [roots, setRoots] = useState(["ቀተለ", "ሰከበ"]);
            const [data, setData] = useState([null, null]);
            const [loading, setLoading] = useState(false);
            const [fault, setFault] = useState("");

            const run = async () => {
                setLoading(true);
                setFault("");
                try {
                    const out = await Promise.all(roots.map((item) => (
                        item.trim() ? API.expandSimple(item) : Promise.resolve({ error: "Missing root." })
                    )));
                    setData(out);
                } catch (e) {
                    setData([null, null]);
                    setFault("The request failed.");
                }
                setLoading(false);
            };

            useEffect(() => { run(); }, []);

            const setRoot = (index, value) => {
                const next = roots.slice();
                next[index] = value;
                setRoots(next);
            };

            return (
                <Page title="Compare" lede="The same persons, two roots, the whole paradigm.">
                    <form
                        className="mb-10"
                        onSubmit={(event) => { event.preventDefault(); if (!loading) run(); }}
                    >
                        <div className="max-w-xs">
                            {roots.map((item, index) => (
                                <div key={index} className={index ? "mt-6" : ""}>
                                    <label className="lbl block mb-2" htmlFor={"cmp-" + index}>Root {index + 1}</label>
                                    <input
                                        id={"cmp-" + index}
                                        className="word-input text-3xl py-1"
                                        value={item}
                                        onChange={(event) => setRoot(index, event.target.value)}
                                        spellCheck="false"
                                    />
                                </div>
                            ))}
                        </div>
                        <button className="btn-quiet mt-6" type="submit" disabled={loading}>
                            {loading ? "Working" : "Compare"}
                        </button>
                    </form>
                    {fault ? <Fault>{fault}</Fault> : null}
                    {data.map((entry, index) => {
                        const message = errorText(entry);
                        if (!message) return null;
                        return <Fault key={index}>{roots[index] || "Root " + (index + 1)}: {message}</Fault>;
                    })}
                    {TENSES.map(([tense, label]) => {
                        const keys = subjectsFor(tense).filter((key) => data.some((entry) => (
                            entry && !errorText(entry) && entry[tense] && typeof entry[tense][key] === "string"
                        )));
                        if (!keys.length) return null;
                        return (
                            <section key={tense} className="mb-10">
                                <h2 className="lbl mb-2">{label}</h2>
                                <table className="paradigm">
                                    <tbody>
                                        <tr>
                                            <td className="lbl w-28">Person</td>
                                            {roots.map((item, index) => (
                                                <td key={index} className="geez text-2xl">{item}</td>
                                            ))}
                                        </tr>
                                        {keys.map((key) => (
                                            <tr key={key}>
                                                <td className="text-muted text-sm">{SUBJECT_LABEL[key]}</td>
                                                {data.map((entry, index) => {
                                                    const word = entry && entry[tense] && typeof entry[tense][key] === "string" ? entry[tense][key] : "";
                                                    const bucket = entry && entry.variants && entry.variants[tense];
                                                    const alts = stringList(bucket && bucket[key]).filter((alt) => alt !== word);
                                                    return (
                                                        <td key={index} className="geez text-xl">
                                                            {word}
                                                            {alts.length ? <span className="text-muted text-base ml-2">{alts.join(", ")}</span> : null}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </section>
                        );
                    })}
                </Page>
            );
        };

        const ETHIOPIC_FONT = "Noto Sans Ethiopic";

        const DerivationsTab = () => {
            const [root, setRoot] = useState("ገብረ");
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [fault, setFault] = useState("");
            const svgRef = useRef(null);

            const draw = async () => {
                if (!root.trim()) return;
                setLoading(true);
                setFault("");
                try {
                    setData(await API.expand(root));
                } catch (e) {
                    setData(null);
                    setFault("The request failed.");
                }
                setLoading(false);
            };

            useEffect(() => { draw(); }, []);

            useEffect(() => {
                if (!svgRef.current || !window.d3) return;
                const svg = d3.select(svgRef.current);
                svg.selectAll("*").remove();
                if (!data || data.error) return;

                const meta = data._meta && typeof data._meta === "object" ? data._meta : {};
                const rootWord = typeof meta.root === "string" && meta.root ? meta.root : root;
                const verbType = typeLabel(typeof meta.verb_type === "string" ? meta.verb_type : "");
                const derived = data.derived && typeof data.derived === "object" && !Array.isArray(data.derived) ? data.derived : {};
                const keys = Object.keys(derived);

                const ink = getComputedStyle(document.body).getPropertyValue("--ink").trim() || "#1c1916";
                const muted = getComputedStyle(document.body).getPropertyValue("--muted").trim() || "#6e675c";
                const line = getComputedStyle(document.body).getPropertyValue("--line").trim() || "#d9d1c3";

                const rowH = 52;
                const W = 720;
                const top = 92;
                const H = Math.max(140, top + Math.max(keys.length, 1) * rowH + 16);
                const g = svg.attr("viewBox", "0 0 " + W + " " + H).append("g");
                const text = (selection) => selection.attr("font-family", ETHIOPIC_FONT);

                text(g.append("text"))
                    .attr("x", 36).attr("y", 40)
                    .attr("font-size", 28).attr("fill", ink)
                    .text(rootWord);
                if (verbType) {
                    text(g.append("text"))
                        .attr("x", 36).attr("y", 64)
                        .attr("font-size", 13).attr("fill", muted)
                        .text(verbType);
                }

                if (!keys.length) return;

                const spineBottom = top + (keys.length - 1) * rowH + 8;
                g.append("line")
                    .attr("x1", 18).attr("y1", 78)
                    .attr("x2", 18).attr("y2", spineBottom)
                    .attr("stroke", line);

                keys.forEach((key, index) => {
                    const y = top + index * rowH;
                    const entry = derived[key];
                    const word = wordOf(entry);
                    const note = entry && typeof entry === "object" && typeof entry.template === "string" ? entry.template : "";
                    const label = typeLabel(key) || key.replace(/_/g, " ");
                    g.append("line")
                        .attr("x1", 18).attr("y1", y - 6)
                        .attr("x2", 36).attr("y2", y - 6)
                        .attr("stroke", line);
                    text(g.append("text"))
                        .attr("x", 44).attr("y", y)
                        .attr("font-size", 13).attr("fill", muted)
                        .text(label);
                    if (word) {
                        text(g.append("text"))
                            .attr("x", 280).attr("y", y)
                            .attr("font-size", 22).attr("fill", ink)
                            .text(word);
                    }
                    if (note) {
                        text(g.append("text"))
                            .attr("x", 470).attr("y", y)
                            .attr("font-size", 13).attr("fill", muted)
                            .text(note);
                    }
                });
            }, [data, root]);

            const shownError = errorText(data);
            const meta = data && data._meta && typeof data._meta === "object" ? data._meta : null;
            const metaRoot = meta && typeof meta.root === "string" ? meta.root : "";
            const metaType = meta && typeof meta.verb_type === "string" ? typeLabel(meta.verb_type) : "";

            return (
                <Page title="Derivations" lede="Derived classes of one root. Not the personal paradigm.">
                    <RootField id="deriv-root" label="Root" value={root} onChange={setRoot} onSubmit={draw} busy={loading} action="Draw" />
                    {fault ? <Fault>{fault}</Fault> : null}
                    {shownError ? <Fault>{shownError}</Fault> : null}
                    {data && !shownError ? (
                        <div>
                            <div className="headword-block">
                                <p className="headword">{metaRoot || root}</p>
                                {metaType ? <p className="subhead">{metaType}</p> : null}
                            </div>
                            <div className="hairline-t hairline-b py-2">
                                <svg ref={svgRef} className="w-full" role="img" aria-label="Derived classes of the root" />
                            </div>
                            <p className="text-muted text-sm mt-4 font-serif italic">
                                Each branch is a derived class. Personal forms stay on the Conjugator.
                            </p>
                            <DerivedList derived={data.derived} />
                            <NominalList nominals={data.nominals} />
                        </div>
                    ) : null}
                </Page>
            );
        };

        const PatternsTab = () => {
            const [tpl, setTpl] = useState(null);
            const [fault, setFault] = useState("");

            useEffect(() => {
                API.templates().then(setTpl).catch(() => setFault("The request failed."));
            }, []);

            const shownError = errorText(tpl);
            const types = tpl && typeof tpl === "object" && !shownError
                ? Object.keys(tpl).filter((key) => !key.startsWith("_") && tpl[key] && typeof tpl[key] === "object")
                : [];
            const meta = tpl && tpl._meta && typeof tpl._meta === "object" ? tpl._meta : null;
            const lede = meta && typeof meta.description === "string"
                ? meta.description
                : "Verb types and the vowel melodies on each stem.";

            return (
                <Page title="Patterns" lede={lede}>
                    {fault ? <Fault>{fault}</Fault> : null}
                    {shownError ? <Fault>{shownError}</Fault> : null}
                    {types.map((typeKey) => {
                        const entry = tpl[typeKey];
                        const derived = entry.derived && typeof entry.derived === "object" ? entry.derived : null;
                        return (
                            <section key={typeKey} className="mb-12">
                                <h2 className="section-title">{typeLabel(typeKey)}</h2>
                                <table className="paradigm">
                                    <tbody>
                                        {TENSES.filter(([tense]) => entry[tense] && typeof entry[tense] === "object").map(([tense, label]) => (
                                            <tr key={tense}>
                                                <td className="text-muted text-sm w-36">{label}</td>
                                                <td className="font-serif italic">{typeof entry[tense].template_name === "string" ? entry[tense].template_name : ""}</td>
                                                <td className="text-muted text-sm">{ordersText(entry[tense].base_pattern)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {derived ? (
                                    <div className="mt-6">
                                        <h3 className="lbl mb-2">Derived</h3>
                                        <table className="paradigm">
                                            <tbody>
                                                {Object.keys(derived).map((key) => {
                                                    const item = derived[key];
                                                    if (!item || typeof item !== "object") return null;
                                                    const note = typeof item.geez_note === "string" ? item.geez_note : "";
                                                    const template = typeof item.template === "string" ? item.template : "";
                                                    return (
                                                        <tr key={key}>
                                                            <td className="text-muted text-sm w-40">{key.replace(/_/g, " ")}</td>
                                                            <td>
                                                                {note ? <span className="geez">{note}</span> : null}
                                                                {template ? <span className="font-serif italic text-sm text-muted ml-3">{template}</span> : null}
                                                            </td>
                                                            <td className="text-muted text-sm">{ordersText(item.pattern)}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                ) : null}
                            </section>
                        );
                    })}
                </Page>
            );
        };

        const ResearchTab = () => (
            <Page title="The mathematics of the script" lede="How a written syllable becomes a root, and how a root becomes a paradigm.">
                <div className="prose-essay font-serif text-[17px]">
                    <p>
                        EthioMorph treats the Ethiopic writing system as an ordered, computable space.
                        Each syllable carries its consonant and its vowel order, so the analyzer can
                        read those orders, strip a surface form down to its consonantal skeleton, and
                        restore the citation root. The lexicon then supplies the gloss and the verb type.
                    </p>
                    <h2 className="section-title">Order, base, revowelize</h2>
                    <p>
                        Each Ethiopic syllable has two coordinates: its consonant row and its vowel
                        order, from 1st (ä) to 7th (o). A Ge'ez word is a sequence of orders.
                        <span className="geez"> ፊደል </span>
                        is the order pattern [3, 1, 6].
                    </p>
                    <p>
                        The analyzer works from the orders. <strong>Order</strong> reads the vowel
                        orders off the surface form. <strong>Base</strong> strips the vowel melody
                        to the consonantal skeleton. <strong>Revowelize</strong> restores the citation
                        form, the dictionary form of the root.
                    </p>
                    <p className="py-2">
                        <span className="geez text-2xl">ፊደል</span>
                        <span className="text-faint mx-3">to</span>
                        <span>[3, 1, 6]</span>
                        <span className="text-faint mx-3">to</span>
                        <span>[1, 1, 1]</span>
                        <span className="text-faint mx-3">to</span>
                        <span className="geez text-2xl">ፈደለ</span>
                    </p>
                    <p>
                        So <span className="geez">ፊደል</span> ("letter") resolves to the root
                        <span className="geez"> ፈደለ </span> ("to spell, write"). The analyzer
                        returns the citation root. The lexicon supplies the gloss and the verb type.
                    </p>
                    <h2 className="section-title">Both directions</h2>
                    <p>
                        Analysis takes a surface form to its root. Generation takes a root and
                        produces its forms: perfective, imperfective, jussive, imperative, and
                        the derived nouns.
                    </p>
                    <h2 className="section-title">Verb types</h2>
                    <div className="hairline-t font-sans text-[15px] not-italic">
                        {[
                            ["Type A", "ሰከበ", "The ordinary triliteral."],
                            ["Type B", "ቀደሰ", "The second radical takes a higher order in the imperfect."],
                            ["Type C", "ባረከ", "The first radical holds the 4th order."],
                            ["Hollow", "ሐወረ", "The middle radical is w or y, and the imperative can collapse."],
                            ["Derived stems", "አስተማረ", "ተ, አ, and አስተ prefixes."],
                        ].map(([name, example, detail]) => (
                            <div key={name} className="entry-row">
                                <span className="lbl pt-1">{name}</span>
                                <span>
                                    <span className="geez text-lg text-ink">{example}</span>
                                    <span className="text-muted text-sm ml-3">{detail}</span>
                                </span>
                            </div>
                        ))}
                    </div>
                    <h2 className="section-title">Programmatic access</h2>
                    <p>The same operations are available as JSON.</p>
                    <div className="font-sans text-sm not-italic hairline-t">
                        {[
                            ["/api/analyze?word=ፊደል", "Analyze a word"],
                            ["/api/expand?root=ቀተለ", "Full expansion, including verb class"],
                            ["/api/expand/simple?root=ቀተለ", "Paradigm, variants, derived words, nominals"],
                            ["/api/templates", "Morphological templates"],
                        ].map(([url, desc]) => (
                            <div key={url} className="hairline-b py-3">
                                <a href={url} className="quiet-link text-[13px] break-all">{url}</a>
                                <p className="text-muted mt-1">{desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </Page>
        );

        const TABS = [
            ["analyzer", "Analyzer", AnalyzerTab],
            ["conjugator", "Conjugator", ConjugatorTab],
            ["forms", "Word forms", WordFormsTab],
            ["compare", "Compare", CompareTab],
            ["derivations", "Derivations", DerivationsTab],
            ["patterns", "Patterns", PatternsTab],
            ["research", "Research", ResearchTab],
        ];

        const App = () => {
            const [tab, setTab] = useState("analyzer");
            const [dark, setDark] = useState(false);

            useEffect(() => {
                document.documentElement.classList.toggle("dark", dark);
            }, [dark]);

            const Active = TABS.find((item) => item[0] === tab)[2];

            return (
                <div className="min-h-screen flex flex-col">
                    <header>
                        <div className="col pt-10">
                            <div className="flex items-baseline justify-between gap-6">
                                <div>
                                    <p className="mast-title">EthioMorph</p>
                                    <p className="mast-sub">A dictionary of Ge'ez morphology</p>
                                </div>
                                <button
                                    className="mode-toggle"
                                    type="button"
                                    onClick={() => setDark(!dark)}
                                    aria-pressed={dark}
                                >
                                    {dark ? "Day" : "Night"}
                                </button>
                            </div>
                            <nav className="section-nav" aria-label="Sections">
                                {TABS.map(([id, label]) => (
                                    <button
                                        key={id}
                                        type="button"
                                        className={"navlink whitespace-nowrap " + (tab === id ? "active" : "")}
                                        onClick={() => setTab(id)}
                                    >
                                        {label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>
                    <main className="flex-1">
                        <Active />
                    </main>
                    <footer className="hairline-t">
                        <div className="col py-6 text-[12px] text-faint">
                            Computational morphology of Ge'ez
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
